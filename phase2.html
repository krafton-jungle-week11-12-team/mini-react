<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Double D · 할 일</title>
    <link rel="icon" href="/dd-logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
    />
  </head>
  <body>
    <div class="dd">
      <header class="dd-header">
        <div class="dd-header-inner">
          <div class="dd-brand">
            <img src="/dd-logo.svg" alt="" class="dd-logo" />
            <span class="dd-name">Double D</span>
            <span class="dd-tag">Phase 2 · 할 일 앱</span>
          </div>
          <div class="dd-actions">
            <!-- #app 바깥이라 mount 뒤에도 남아요 (FR-AP02) -->
            <a href="./index.html" class="dd-home">첫 화면으로</a>
            <div class="dd-render-count">렌더링 <strong id="render-count">0</strong>회</div>
          </div>
        </div>
      </header>
      <main class="dd-main">
        <section class="panel panel-app" aria-labelledby="app-panel-title">
          <div class="panel-head">
            <h2 id="app-panel-title" class="panel-title">할 일 앱</h2>
            <span id="app-tab-title" class="panel-sub"></span>
          </div>
          <div class="render-frame">
            <!-- mount가 이 안을 모두 바꿔요 -->
            <div id="app" class="render-root">
              <p>할 일 앱을 준비하고 있어요.</p>
            </div>
          </div>
        </section>
        <section class="panel" aria-labelledby="hooks-title">
          <div class="panel-head">
            <h2 id="hooks-title" class="panel-title">hooks 배열</h2>
            <span class="panel-sub">이번 렌더링의 칸</span>
          </div>
          <ol id="hooks-view" class="panel-list"></ol>
        </section>
        <section class="panel" aria-labelledby="diff-title">
          <div class="panel-head">
            <h2 id="diff-title" class="panel-title">Diff</h2>
            <p id="diff-message" class="message"></p>
          </div>
          <ul id="diff-view" class="panel-list"></ul>
        </section>
        <section class="panel" aria-labelledby="log-title">
          <div class="panel-head">
            <h2 id="log-title" class="panel-title">실행 기록</h2>
            <p id="log-summary" class="message"></p>
          </div>
          <ol id="log-view" class="panel-list"></ol>
        </section>
      </main>
    </div>
    <script type="module" src="/src/phase2/page/main.ts"></script>
  </body>
</html>
