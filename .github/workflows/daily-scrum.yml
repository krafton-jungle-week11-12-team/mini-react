name: Daily Scrum

on:
  schedule:
    - cron: '0 19 * * *'   # 매일 04:00 KST
  workflow_dispatch:

permissions:
  discussions: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read REPO_ID CAT_ID <<< $(gh api graphql \
            -f query='query($o:String!,$n:String!){repository(owner:$o,name:$n){id discussionCategory(slug:"daily-scrum"){id}}}' \
            -f o="${GITHUB_REPOSITORY%/*}" -f n="${GITHUB_REPOSITORY#*/}" \
            --jq '.data.repository | "\(.id) \(.discussionCategory.id)"')

          gh api graphql \
            -f query='mutation($r:ID!,$c:ID!,$t:String!){createDiscussion(input:{repositoryId:$r,categoryId:$c,title:$t,body:""}){discussion{url}}}' \
            -f r="$REPO_ID" -f c="$CAT_ID" -f t="[Daily] $(TZ=Asia/Seoul date +%F)"